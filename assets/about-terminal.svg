<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"><animate attributeName="stop-color" values="#06b6d4;#2563eb;#a855f7;#06b6d4" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#2563eb"><animate attributeName="stop-color" values="#2563eb;#a855f7;#06b6d4;#2563eb" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <!-- typing clips: 12s loop -->
    <clipPath id="c1"><rect x="30" y="66" height="26" width="0"><animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.042;0.108;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="30" y="129" height="26" width="0"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;0.167;0.25;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="30" y="192" height="26" width="0"><animate attributeName="width" values="0;0;250;250;0" keyTimes="0;0.308;0.408;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="2" y="2" width="796" height="296" rx="16" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="796" height="40" rx="16" fill="#161b22"/>
  <rect x="2" y="26" width="796" height="16" fill="#161b22"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="22" r="6" fill="#27c93f"/>
  <text x="400" y="27" fill="#8b949e" font-size="13" text-anchor="middle">dhruv@portfolio: ~</text>

  <!-- 1 -->
  <text clip-path="url(#c1)" x="30" y="85" font-size="17" fill="#e6edf3"><tspan fill="#27c93f">➜</tspan> <tspan fill="#38bdf8">~</tspan> whoami</text>
  <text x="30" y="113" font-size="17" fill="#facc15" opacity="0">dhruv_gohel
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.117;0.127;0.95;1" dur="12s" repeatCount="indefinite"/></text>

  <!-- 2 -->
  <text clip-path="url(#c2)" x="30" y="148" font-size="17" fill="#e6edf3"><tspan fill="#27c93f">➜</tspan> <tspan fill="#38bdf8">~</tspan> cat role.txt</text>
  <text x="30" y="176" font-size="17" fill="#a5f3fc" opacity="0">Full-Stack Developer | MSc DC Student 🎓
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.258;0.268;0.95;1" dur="12s" repeatCount="indefinite"/></text>

  <!-- 3 -->
  <text clip-path="url(#c3)" x="30" y="211" font-size="17" fill="#e6edf3"><tspan fill="#27c93f">➜</tspan> <tspan fill="#38bdf8">~</tspan> cat focus.txt</text>
  <text x="30" y="239" font-size="17" fill="#c4b5fd" opacity="0">AI/ML  •  Web Apps  •  Clean Code 🚀
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.417;0.427;0.95;1" dur="12s" repeatCount="indefinite"/></text>

  <!-- prompt + blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.467;0.477;0.95;1" dur="12s" repeatCount="indefinite"/>
    <text x="30" y="274" font-size="17" fill="#e6edf3"><tspan fill="#27c93f">➜</tspan> <tspan fill="#38bdf8">~</tspan></text>
    <rect x="82" y="259" width="10" height="19" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
